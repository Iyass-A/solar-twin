# Records the sky events of a week into an MP4 video (phase 8, step 3), by hand only:
# builds the site, films video.html frame by frame with Chrome (no window), joins the frames with ffmpeg,
# and keeps the video as a downloadable artifact of this run for 14 days ("sky-video" on the run's page).
# Read-only: it changes nothing in the repository and publishes nothing. To remove it: delete this file.
name: Render sky video

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language'
        type: choice
        options: [ar, de, en]
        default: ar
      format:
        description: 'Shape: 16x9 (wide) or 9x16 (upright)'
        type: choice
        options: ['16x9', '9x16']
        default: '16x9'
      from:
        description: 'First day, YYYY-MM-DD (UTC); empty = today'
        required: false
        default: ''
      days:
        description: 'How many days'
        required: false
        default: '7'
      event:
        description: 'Only this event (its number in those days, from 0); empty = the whole week'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Asteroids passing the Earth, as on the published site
        run: |
          mkdir -p public/data/live
          curl -fsS --max-time 30 https://iyass-a.github.io/solar-twin/data/live/close-approaches.json \
            -o public/data/live/close-approaches.json \
            || echo "::warning::No close-approach file from the site: the video has no asteroids"

      - name: Build the site
        run: npx vite build

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)

      - name: Record
        env:
          IN_LANG: ${{ inputs.lang }}
          IN_FORMAT: ${{ inputs.format }}
          IN_FROM: ${{ inputs.from }}
          IN_DAYS: ${{ inputs.days }}
          IN_EVENT: ${{ inputs.event }}
        run: |
          FROM="${IN_FROM:-$(date -u +%F)}"
          [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::from must be YYYY-MM-DD"; exit 1; }
          [[ "$IN_DAYS" =~ ^[0-9]{1,2}$ ]] || { echo "::error::days must be a number"; exit 1; }
          args=(--lang "$IN_LANG" --format "$IN_FORMAT" --from "$FROM" --days "$IN_DAYS" --out "video/sky-$FROM-$IN_LANG-$IN_FORMAT.mp4")
          if [ -n "$IN_EVENT" ]; then
            [[ "$IN_EVENT" =~ ^[0-9]{1,3}$ ]] || { echo "::error::event must be a number"; exit 1; }
            args+=(--event "$IN_EVENT")
          fi
          mkdir -p video
          node scripts/record-video.mjs "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: sky-video
          path: video/*.mp4
          retention-days: 14
          if-no-files-found: error
