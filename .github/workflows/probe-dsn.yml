# Temporary: checks if DSN Now data can be fetched from GitHub's machines, and its format.
name: Probe DSN Now
on:
  push:
    branches: [probe-dsn]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          for f in dsn.xml config.xml; do
            echo "=== $f"
            curl -sS -m 30 -D - -o /dev/null -H "Origin: https://iyass-a.github.io" "https://eyes.nasa.gov/dsn/data/$f?r=$(date +%s)" || echo "FAILED $?"
          done
      - name: config.xml
        run: curl -sS -m 30 "https://eyes.nasa.gov/dsn/config.xml" -o c1.xml -w "root config: %{http_code} %{size_download}\n" || true; curl -sS -m 30 "https://eyes.nasa.gov/dsn/data/config.xml" -w "\n%{http_code} %{size_download}\n" || true
      - name: dsn.xml (full)
        run: curl -sS -m 30 "https://eyes.nasa.gov/dsn/data/dsn.xml?r=$(date +%s)" -w "\n%{http_code} %{size_download} %{time_total}\n"
      - name: Update frequency
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sS -m 30 "https://eyes.nasa.gov/dsn/data/dsn.xml?r=$(date +%s%N)" -o d.xml
            echo "$(date -u +%T) size=$(wc -c < d.xml) ts=$(grep -o '<timestamp>[0-9]*</timestamp>' d.xml) md5=$(md5sum d.xml | cut -c1-8)"
            sleep 10
          done
          echo "--- without cache buster"
          curl -sS -m 30 -D - -o /dev/null "https://eyes.nasa.gov/dsn/data/dsn.xml"
