# Temporary: checks if DSN Now data can be fetched from GitHub's machines, and its format.
name: Probe DSN Now
on:
  push:
    branches: [probe-dsn]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: config.xml (full)
        run: |
          curl -sS -m 30 -D - "https://eyes.nasa.gov/dsn/config.xml"
      - name: dsn.xml again (full)
        run: |
          curl -sS -m 30 "https://eyes.nasa.gov/dsn/data/dsn.xml?r=$(date +%s)"
