# Builds the site and publishes it to GitHub Pages on every push to main, and once a day
# to bring in fresh live data from JPL (close approaches to Earth). The live data goes only into
# the published site, nothing is committed, so the same permissions as before are enough.
# To stop the daily run, delete the two "schedule" lines.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # every day at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Close approaches from CNEOS (JPL), straight into this build. If JPL does not answer,
      # the copy on the site now is kept. Never stops the deploy: see scripts/fetch-close-approaches.ts.
      - name: Fetch live data from JPL
        run: npx tsx scripts/fetch-close-approaches.ts public/data/live/close-approaches.json https://iyass-a.github.io/solar-twin/data/live/close-approaches.json
        timeout-minutes: 10
        continue-on-error: true
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
