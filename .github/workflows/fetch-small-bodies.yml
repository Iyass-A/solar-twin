# Fetches asteroid and comet orbits (with their uncertainty) from JPL's Small-Body Database,
# and reference positions from JPL Horizons for the checks. See scripts/fetch-small-bodies.ts.
#
# Runs only when started by hand (Actions tab -> "Fetch small-body data" -> Run workflow).
# The result goes to the branch "data-update", never straight to main, so it can be
# reviewed before it reaches the site.
name: Fetch small-body data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "count: only count the bodies in each group (quick, nothing is pushed); full: fetch everything"
        type: choice
        options: [full, count, probe]
        default: full

permissions:
  contents: write # only to push the data-update branch of this repository

concurrency:
  group: fetch-small-bodies
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # about 5,000 requests, one at a time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Count only
        if: inputs.mode == 'count'
        run: npx tsx scripts/count-small-bodies.ts data/small-body-groups.json
      - name: Probe the SBDB API (temporary diagnosis)
        if: inputs.mode == 'probe'
        run: npx tsx scripts/probe-sbdb.ts
      - name: Fetch
        if: inputs.mode == 'full'
        run: |
          set -o pipefail
          npx tsx scripts/fetch-small-bodies.ts data/small-bodies.txt data/small-body-groups.json | tee scripts/reference/fetch-log.txt
      - name: Push the result to the data-update branch
        if: inputs.mode == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data-update
          git add src/data/small-bodies.json public/data/cov scripts/reference/small-bodies-horizons.json scripts/reference/fetch-log.txt
          git commit -m "Small-body data from JPL SBDB and Horizons ($(date -u +%Y-%m-%d))"
          git push --force origin data-update
